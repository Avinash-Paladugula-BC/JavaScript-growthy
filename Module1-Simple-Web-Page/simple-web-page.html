<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Display message when the button is clicked</h3>
    <p id="hello-button"></p>
    <button onclick="wishingMessage()">Click me</button>

    <script>
        function wishingMessage(){
            document.getElementById("hello-button").innerHTML="Hello there! Good morning!!!"
        }
    </script>
</body>
</html>
